# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Run Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  start-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: store
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
  # users-es Tests
  users-es:
    needs: [ start-postgres ]  # Depends on start-postgres job
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        working-directory: Services/Entity/users-es
        run: go get .
      - name: Run Tests
        working-directory: Services/Entity/users-es/test
        run: go test -v ./...
  # role-es Tests
  role-es:
    needs: [ start-postgres ]  # Depends on start-postgres job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        working-directory: Services/Entity/role-es
        run: go get .
      - name: Run Tests
        working-directory: Services/Entity/role-es/test
        run: go test -v ./...
  # role-es Tests
  auth-us:
    needs: [ start-postgres ]  # Depends on start-postgres job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        working-directory: Services/Utility/auth-us
        run: go get .
      - name: Run Tests
        working-directory: Services/Utility/auth-us/test
        run: go test -v ./...
