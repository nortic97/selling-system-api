# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Run Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: store
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
    steps:
       # users-es Tests
      - uses: actions/checkout@v4
      - name: Setup Go users-es
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies users-es
        working-directory: Services/Entity/users-es
        run: go get .
      - name: Run Tests users-es
        working-directory: Services/Entity/users-es/test
        run: go test -v ./...
      # role-es Tests
      - uses: actions/checkout@v4
      - name: Setup Go role-es
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies role-es
        working-directory: Services/Entity/role-es
        run: go get .
      - name: Run Tests role-es
        working-directory: Services/Entity/role-es/test
        run: go test -v ./...
      # auth-us Tests
      - uses: actions/checkout@v4
      - name: Setup Go auth-us
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies auth-us
        working-directory: Services/Utility/auth-us
        run: go get .
      - name: Run Tests auth-us
        working-directory: Services/Utility/auth-us/test
        run: go test -v ./...