# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Run Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Start Fake Postgres Container
  start-postgres:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres Docker container
        uses: eladweissman/postgresql-init@v1.4  # Adjust version as needed
        with:
          image: postgres:16
          database: store  # Customize database name
          user: postgres       # Customize username (if needed)
          password: 1234   # Customize password (if needed)
          port: 5432           # Customize port (if needed)
          docker_driver: "overlay2"  # Consider driver if issues arise
  # users-es Tests
  users-es:
    needs: [ start-postgres ]  # Depends on start-postgres job
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        working-directory: Services/Entity/users-es
        run: go get .
      - name: Run Tests
        working-directory: Services/Entity/users-es/test
        run: go test -v ./...
  # role-es Tests
  role-es:
    needs: [ start-postgres ]  # Depends on start-postgres job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        working-directory: Services/Entity/role-es
        run: go get .
      - name: Run Tests
        working-directory: Services/Entity/role-es/test
        run: go test -v ./...
  # role-es Tests
  auth-us:
    needs: [ start-postgres ]  # Depends on start-postgres job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        working-directory: Services/Utility/auth-us
        run: go get .
      - name: Run Tests
        working-directory: Services/Utility/auth-us/test
        run: go test -v ./...
