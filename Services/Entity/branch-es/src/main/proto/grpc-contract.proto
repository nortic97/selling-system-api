syntax = "proto3";

package branch;

option java_multiple_files = true;
option java_package = "com.nortic.pos.es.branch.grpc.gen";
option java_outer_classname = "BranchProto";

service BranchService {
  rpc CreateBranch (Store) returns (Store);
  rpc GetBranchById (BranchIdRequest) returns (Branch);
  rpc UpdateBranch (Branch) returns (Branch);
  rpc DeleteBranch (BranchIdRequest) returns (DeleteResponse);
  rpc SoftDeleteBranch (BranchIdRequest) returns (DeleteResponse);
  rpc ChangeBranchStatus (ChangeStatusRequest) returns (BranchResponse);
  rpc ListBranchesByStore(ListBranchesRequest) returns (ListBranchesResponse);
}

message Store {
  optional string id = 1;
  string tax_id = 2;
  string name = 3;
  optional string logo = 4;
  string description = 5;
  optional string slogan = 6;
  string address = 7;
  string state_province = 8;
  string city = 9;
  string phone_number = 10;
  string email = 11;
  optional bool is_active = 12;
  optional string created_at = 13;
  optional string updated_at = 14;
  optional string deleted_at = 15;
}

message Branch {
  string id = 1;
  Store store = 2;
  string name = 3;
  string address = 4;
  string phone_number = 5;
  string email = 6;
  bool is_active = 7;
  optional string created_at = 8;
  optional string updated_at = 9;
  optional string deleted_at = 10;
}

message ListBranchesRequest {
  string store_id = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
  optional string name = 4;
  optional bool is_active = 5;
}

message ListBranchesResponse {
  int32 total_items = 1;
  int32 total_pages = 2;
  int32 current_page = 3;
  int32 items_per_page = 4;
  bool has_next_page = 5;
  bool has_previous_page = 6;
  repeated Branch branches = 7;
}

message BranchIdRequest {
  string id = 1;
}

message BranchResponse {
  bool success = 1;
}

message DeleteResponse {
  bool success = 1;
}

message ChangeStatusRequest {
  string id = 1;
  bool status = 2;
}
