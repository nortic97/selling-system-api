openapi: 3.0.0
info:
  title: Branch Service API
  version: 0.0.1
  description: |
    API for managing branches (sucursales) within stores, including CRUD operations, soft delete, filtering, and pagination.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{protocol}://{hostname}{port}{basePath}"
    description: Configurable server (local or deployed)
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      hostname:
        default: localhost
      port:
        default: ":8080"
      basePath:
        default: ""
        enum:
          - ""
          - "/branch-es"
        description: Optional path for the deployed version

paths:
  /api/v1/es/branch:
    post:
      summary: Create a new branch
      operationId: createBranch
      tags:
        - Branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Branch"
      responses:
        '201':
          description: Branch created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Bad Request"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/branch/{id}:
    get:
      summary: Get a branch by ID
      operationId: getBranchById
      tags:
        - Branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Branch retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        '404':
          description: Branch not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Branch not found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

    put:
      summary: Update a branch
      operationId: updateBranch
      tags:
        - Branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Branch"
      responses:
        '200':
          description: Branch updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Bad Request"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Branch not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Branch not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

    delete:
      summary: Permanently delete a branch
      operationId: deleteBranch
      tags:
        - Branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Branch deleted successfully
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Bad Request"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Branch not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Branch not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/branch/{id}/soft-delete:
    patch:
      summary: Soft delete a branch
      operationId: softDeleteBranch
      tags:
        - Branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Branch soft deleted successfully
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Bad Request"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Branch not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Branch not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/branch/{id}/status:
    patch:
      summary: Change branch status (activate/deactivate)
      operationId: changeBranchStatus
      tags:
        - Branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
              required:
                - isActive
      responses:
        '200':
          description: Branch status updated successfully
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Bad Request"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Branch not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Branch not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/branch/list/{storeId}:
    get:
      summary: List branches of a store
      operationId: listBranchesByStore
      tags:
        - Branch
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Branches retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchPagination"
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Bad Request"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Branch not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Branch not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storeId:
          $ref: "#/components/schemas/Store"
        name:
          type: string
        address:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - storeId
        - name
        - address
        - phoneNumber
        - email

    Store:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taxId:
          type: string
        name:
          type: string
        logo:
          type: string
        description:
          type: string
        slogan:
          type: string
        address:
          type: string
        stateProvince:
          type: string
        city:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time

    BranchPagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of branches matching the query in that store
          example: 300
        page:
          type: integer
          description: Current page number
          example: 2
        limit:
          type: integer
          description: Number of branches per page
          example: 10
        hasNextPage:
          type: boolean
          description: True if there is a next page
          example: true
        hasPreviousPage:
          type: boolean
          description: True if there is a previous page
          example: true
        branchesList:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
      required:
        - total
        - page
        - limit
        - hasNextPage
        - hasPreviousPage

    HttpError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      required:
        - code
        - message

security:
  - bearerAuth: []
