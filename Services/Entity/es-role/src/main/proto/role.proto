syntax = "proto3";

package com.nortic.pos.es.role.grpc;

option java_multiple_files = false;
option java_package = "com.nortic.pos.es.role.grpc";
option java_outer_classname = "RoleProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

message RoleRequest {
  string store_id = 1;
  string name = 2;
  optional string description = 3;
}

message StatusRequest {
  bool active = 1;
}

message UpdateRoleRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
}

message RoleIdRequest {
  string id = 1;
}

message ChangeStatusRequest {
  string id = 1;
  bool active = 2;
}

message PermissionRequest {
  string role_id = 1;
  repeated string permission_ids = 2;
}

message PermissionIdRequest {
  string role_id = 1;
  string permission_id = 2;
}

message PermissionResponse {
  string id = 1;
  string code = 2;
  string module = 3;
  string name = 4;
  optional string description = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message PaginationRequest {
  int32 page = 1;
  int32 size = 2;
  repeated string sort = 3;
}

message RoleResponse {
  string id = 1;
  string store_id = 2;
  string name = 3;
  optional string description = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  optional google.protobuf.Timestamp deleted_at = 8;
}

message FieldErrorDetail {
  string field = 1;
  string message = 2;
  string rejected_value = 3;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated FieldErrorDetail details = 4;
}

message PaginatedRoleResponse {
  repeated RoleResponse content = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
  int32 size = 4;
  int32 number = 5;
  bool first = 6;
  bool last = 7;
}

service RoleService {
  rpc CreateRole(RoleRequest) returns (RoleResponse);
  rpc ListRoles(PaginationRequest) returns (PaginatedRoleResponse);
  rpc GetRole(RoleIdRequest) returns (RoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc DeleteRole(RoleIdRequest) returns (google.protobuf.Empty);
  rpc ChangeStatus(ChangeStatusRequest) returns (RoleResponse);
  rpc RestoreRole(RoleIdRequest) returns (RoleResponse);
  rpc GetRolePermission(RoleIdRequest) returns (stream PermissionResponse);
  rpc AddPermissionToRole(PermissionRequest) returns (stream PermissionResponse);
  rpc RemovePermissionsFromRole(PermissionRequest) returns (google.protobuf.Empty);
  rpc RemovePermissionFromRole(PermissionIdRequest) returns (google.protobuf.Empty);
}
