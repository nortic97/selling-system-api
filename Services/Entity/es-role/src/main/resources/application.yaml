spring:

  application:
    name: ${APPLICATION_NAME:es-role}
    env: ${ENVIRONMENT:local}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:selling_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    defer-datasource-initialization: false

  web:
    error:
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false
      include-path: never

  grpc:
    server:
      port: ${GRPC_PORT:9090}
      health:
        enabled: true
      reflection:
        enabled: true

  jackson:
    time-zone: ${TIME_ZONE:America/Bogota}

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful

security:
  jwt:
    secret: ${JWT_SECRET:TjByNzFjUDBzXzIwMjZfQmFja2VuZF9Vc2VyX1NlcnZpY2VfSnd0X1NlY3JldF9WM19BOXhMMm1RN3BSOHRXNG5L}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    metadata-map:
      metrics-path: ${EUREKA_METRICS_PATH:/actuator/prometheus}

management:
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
          - info

  endpoint:
    health:
      show-details: always