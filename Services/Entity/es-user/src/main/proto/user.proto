syntax = "proto3";

package com.nortic.pos.es.user.grpc;

option java_multiple_files = false;
option java_package = "com.nortic.pos.es.user.grpc";
option java_outer_classname = "UserProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ==============================================================================
// Servicio gRPC para uso interno entre microservicios (ms-*) y servicios de entidad (es-*)
// Nota: X-Correlation-Id y Authorization (JWT) deben enviarse vía gRPC Metadata.
// ==============================================================================
service UserService {
  // Retorna una lista paginada de usuarios
  rpc GetAllUsers(GetAllUsersRequest) returns (PaginatedUserResponse);

  // Obtiene un usuario específico por su UUID
  rpc GetUserById(GetUserByIdRequest) returns (UserResponse);

  // Crea un nuevo usuario
  rpc CreateUser(CreateUserRequest) returns (UserResponse);

  // Actualiza los datos de un usuario existente
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);

  // Realiza un borrado lógico (Soft Delete)
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);

  // Restaura un usuario eliminado lógicamente
  rpc RestoreUser(RestoreUserRequest) returns (UserResponse);
}

// ==============================================================================
// Peticiones (Requests)
// ==============================================================================

message GetAllUsersRequest {
  int32 page = 1;
  int32 size = 2;
  repeated string sort = 3; // Formato esperado: "campo,asc" o "campo,desc"
}

message GetUserByIdRequest {
  string id = 1; // UUID
}

message DeleteUserRequest {
  string id = 1; // UUID
}

message RestoreUserRequest {
  string id = 1; // UUID
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string document_type = 3;
  string document_number = 4;
  string username = 5;
  string password = 6; // Texto plano a encriptar por el es-user
  string email = 7;
  bool is_active = 8;

  // Campos opcionales
  optional string phone = 9;
  optional string address = 10;
  optional string date_of_birth = 11; // Formato YYYY-MM-DD
  optional string photo = 12;
}

message UpdateUserRequest {
  string id = 1; // UUID del usuario a actualizar

  // Campos editables (podrían ser todos opcionales dependiendo de tu lógica de PATCH/PUT)
  optional string first_name = 2;
  optional string last_name = 3;
  optional string document_type = 4;
  optional string document_number = 5;
  optional string username = 6;
  optional string email = 7;
  optional string phone = 8;
  optional bool is_active = 9;
  optional string address = 10;
  optional string date_of_birth = 11; // Formato YYYY-MM-DD
  optional string photo = 12;
}

// ==============================================================================
// Respuestas (Responses)
// ==============================================================================

message UserResponse {
  string id = 1; // UUID
  string first_name = 2;
  string last_name = 3;
  string document_type = 4;
  string document_number = 5;
  string username = 6;
  string email = 7;
  optional string phone = 8;
  bool is_active = 9;
  optional string address = 10;
  optional string date_of_birth = 11; // Formato YYYY-MM-DD
  optional string photo = 12;

  // Auditoría
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  optional google.protobuf.Timestamp deleted_at = 15;
}

message PaginatedUserResponse {
  repeated UserResponse content = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
  int32 size = 4;
  int32 number = 5;
  bool first = 6;
  bool last = 7;
}