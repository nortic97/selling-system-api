syntax = "proto3";

package com.nortic.pos.es.user.grpc;

option java_multiple_files = false;
option java_package = "com.nortic.pos.es.user.grpc";
option java_outer_classname = "UserProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service UserService {
  rpc GetAllUsers(GetAllUsersRequest) returns (PaginatedUserResponse);
  rpc QueryUsers(UserQueryRequest) returns (PaginatedUserResponse);
  rpc SearchUsers(SearchUsersRequest) returns (PaginatedUserResponse);
  rpc GetUserById(GetUserByIdRequest) returns (UserResponse);
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
  rpc RestoreUser(RestoreUserRequest) returns (UserResponse);
  rpc ChangeUserPassword(ChangeUserPasswordRequest) returns (UserResponse);
  rpc ChangeUsername(ChangeUsernameRequest) returns (UserResponse);
  rpc ChangeEmail(ChangeEmailRequest) returns (UserResponse);
  rpc ChangePhone(ChangePhoneRequest) returns (UserResponse);
  rpc ChangeUserStatus(ChangeUserStatusRequest) returns (UserResponse);
  rpc Authenticate(AuthenticateRequest) returns (UserResponse);
}


message GetAllUsersRequest {
  int32 page = 1;
  int32 size = 2;
  repeated string sort = 3;
}

message UserQueryRequest {
  optional string query = 1;
  int32 page = 2;
  int32 size = 3;
  repeated string sort = 4;
}

message SearchUsersRequest {
  int32 page = 1;
  int32 size = 2;
  repeated string sort = 3;

  optional string first_name = 4;
  optional string last_name = 5;
  optional string document_type = 6;
  optional string document_number = 7;
  optional string username = 8;
  optional string email = 9;
  optional string phone = 10;
  optional string address = 11;
  optional string date_of_birth = 12;
  optional bool is_active = 14;
}

message GetUserByIdRequest {
  string id = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message RestoreUserRequest {
  string id = 1;
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string document_type = 3;
  string document_number = 4;
  string username = 5;
  string password = 6;
  string email = 7;
  string phone = 8;

  optional string date_of_birth = 9;
  optional string address = 10;
  optional string photo_url = 11;
}

message UpdateUserRequest {
  string id = 1;

  optional string first_name = 2;
  optional string last_name = 3;
  optional string document_type = 4;
  optional string document_number = 5;
  optional string username = 6;
  optional string email = 8;
  optional string phone = 9;
  optional string address = 10;
  optional string date_of_birth = 11;
  optional string photo_url = 12;
}

message ChangeUserPasswordRequest {
  string id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangeUsernameRequest {
  string id = 1;
  string username = 2;
}

message ChangeEmailRequest {
  string id = 1;
  string email = 2;
}

message ChangePhoneRequest {
  string id = 1;
  string phone = 2;
}

message ChangeUserStatusRequest {
  string id = 1;
  bool active = 2;
}

message AuthenticateRequest {
  string username = 1;
  string password = 2;
}


message UserResponse {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string document_type = 4;
  string document_number = 5;
  string username = 6;
  string email = 7;
  optional string phone = 8;
  bool is_active = 9;
  optional string address = 10;
  optional string date_of_birth = 11;
  optional string photo_url = 12;

  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  optional google.protobuf.Timestamp deleted_at = 15;
}

message PaginatedUserResponse {
  repeated UserResponse content = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
  int32 size = 4;
  int32 number = 5;
  bool first = 6;
  bool last = 7;
}