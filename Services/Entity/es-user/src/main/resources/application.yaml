spring:

  application:
    name: ${APPLICATION_NAME:es-user}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:selling_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  web:
    error:
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false
      include-path: never

  grpc:
    server:
      port: ${GRPC_PORT:9090}
      health:
        enabled: true
      reflection:
        enabled: true

  jackson:
    time-zone: ${TIME_ZONE:America/Bogota}

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:N0r71cP0s1997*S3cur3JWTK3yF0rHMACSHA256Alg0rithm!@#$%^&*()}
