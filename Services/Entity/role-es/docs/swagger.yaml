definitions:
  models.Action:
    properties:
      Action:
        type: string
      ApiUrlAction:
        type: string
      Id:
        type: string
      Value:
        type: string
    type: object
  models.Health:
    properties:
      environment:
        type: string
      status:
        type: string
    type: object
  models.Menu:
    properties:
      Icon:
        type: string
      Id:
        type: string
      MenuActions:
        items:
          $ref: '#/definitions/models.Action'
        type: array
      MenuHasSubMenu:
        type: boolean
      MenuName:
        type: string
      MenuPosition:
        type: integer
      MenuSubMenu:
        items:
          $ref: '#/definitions/models.SubMenu'
        type: array
      MenuUrl:
        type: string
    type: object
  models.NewRole:
    properties:
      Description:
        type: string
      Id:
        type: string
      Menu:
        items:
          $ref: '#/definitions/models.Menu'
        type: array
      RoleName:
        type: string
    type: object
  models.Role:
    properties:
      Description:
        type: string
      Id:
        type: string
      Menu:
        items:
          $ref: '#/definitions/models.Menu'
        type: array
      RoleName:
        type: string
    type: object
  models.RoleFilter:
    properties:
      Roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
      Size:
        type: integer
      TotalData:
        type: integer
      startAfterKey:
        type: string
    type: object
  models.SubMenu:
    properties:
      Id:
        type: string
      SubMenuActions:
        items:
          $ref: '#/definitions/models.Action'
        type: array
      SubMenuName:
        type: string
      SubMenuPosition:
        type: integer
      SubMenuUrl:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/roles/es/v1/CreateRole:
    post:
      consumes:
      - application/json
      description: The actual endpoint create a role and save in database.
      parameters:
      - description: Created Role
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.NewRole'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      security:
      - ApiKeyAuth: []
      summary: Create role
      tags:
      - CreateRole
  /api/roles/es/v1/DeleteRole/{id}:
    delete:
      consumes:
      - application/json
      description: The actual endpoint Delete a role.
      parameters:
      - description: Role Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
      security:
      - ApiKeyAuth: []
      summary: Delete role
      tags:
      - DeleteRole
  /api/roles/es/v1/GetAllRoles:
    get:
      consumes:
      - application/json
      description: The actual endpoint list roles.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      security:
      - ApiKeyAuth: []
      summary: Read role without pagination
      tags:
      - GetAllRoles
  /api/roles/es/v1/ReadAllRolesPaginate/{size}/{startAfterKey}:
    get:
      consumes:
      - application/json
      description: The actual endpoint list roles.
      parameters:
      - description: Size
        in: path
        name: size
        required: true
        type: integer
      - description: Send null string if first page
        in: path
        name: startAfterKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RoleFilter'
      security:
      - ApiKeyAuth: []
      summary: Read role whit pagination
      tags:
      - ReadAllRolesPaginate
  /api/roles/es/v1/ReadRoleById/{id}:
    get:
      consumes:
      - application/json
      description: The actual endpoint Search a role by Id.
      parameters:
      - description: Role Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      security:
      - ApiKeyAuth: []
      summary: Read role by ID
      tags:
      - ReadRoleById
  /api/roles/es/v1/UpdateRole:
    put:
      consumes:
      - application/json
      description: The actual endpoint Update a role and save in database.
      parameters:
      - description: Update Role
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.NewRole'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      security:
      - ApiKeyAuth: []
      summary: Update role
      tags:
      - UpdateRole
  /api/roles/es/v1/actuator:
    get:
      consumes:
      - application/json
      description: The actual endpoint show Service status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Health'
      summary: Service status
      tags:
      - Actuator
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
