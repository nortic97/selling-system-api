info:
  contact: {}
paths:
  /roles/es/v1/CreateRole:
    post:
      consumes:
      - application/json
      description: The actual endpoint create a role and save in database.
      parameters:
      - description: Created Role
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.NewRole'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      summary: Create role
      tags:
      - CreateRole
  /roles/es/v1/DeleteRole/{id}:
    delete:
      consumes:
      - application/json
      description: The actual endpoint Delete a role.
      parameters:
      - description: Role Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
      summary: Delete role
      tags:
      - DeleteRole
  /roles/es/v1/ReadRoleById/{id}:
    get:
      consumes:
      - application/json
      description: The actual endpoint Search a role by Id.
      parameters:
      - description: Role Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      summary: Read role by ID
      tags:
      - ReadRoleById
  /roles/es/v1/UpdateRole:
    put:
      consumes:
      - application/json
      description: The actual endpoint Update a role and save in database.
      parameters:
      - description: Update Role
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.NewRole'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      summary: Update role
      tags:
      - UpdateRole
  /roles/es/v1/actuator:
    get:
      consumes:
      - application/json
      description: The actual endpoint show Service status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Health'
      summary: Service status
      tags:
      - Actuator
swagger: "2.0"
