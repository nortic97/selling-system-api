        type: string
      MenuAction:
        items:
          type: string
        type: array
      MenuSubMenu:
        items:
          $ref: '#/definitions/models.SubMenu'
        type: array
      PermissionHasSubMenu:
        type: boolean
      PermissionName:
        type: string
      PermissionPosition:
        type: integer
      PermissionUrl:
        type: string
    type: object
  models.NewRole:
    properties:
      Description:
        type: string
      Id:
        type: string
      Menu:
        items:
          $ref: '#/definitions/models.Menu'
        type: array
      RoleName:
        type: string
    type: object
  models.Role:
    properties:
      Description:
        type: string
      Id:
        type: string
      Menu:
        items:
          $ref: '#/definitions/models.Menu'
        type: array
      RoleName:
        type: string
    type: object
  models.SubMenu:
