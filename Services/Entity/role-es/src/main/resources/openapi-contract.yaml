openapi: 3.0.0
info:
  title: Roles Service API
  version: 0.0.1
  description: |
    API for managing roles within stores, including CRUD operations, soft delete, permanent delete, filtering, and pagination.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{protocol}://{hostname}{port}{basePath}"
    description: Configurable server
    variables:
      protocol:
        enum: [http, https]
        default: http
      hostname:
        default: localhost
      port:
        default: ":8080"
      basePath:
        default: ""
        enum: ["", "/role-es"]

paths:
  /api/v1/es/role:
    post:
      summary: Create a new role
      operationId: createRole
      tags:
        - Role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

    get:
      summary: List all roles
      operationId: listRoles
      tags:
        - Role
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /api/v1/es/role/paginated:
    get:
      summary: List roles with pagination
      operationId: listRolesPaginated
      tags:
        - Role
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: name
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer

  /api/v1/es/role/{id}:
    get:
      summary: Get a role by ID
      operationId: getRoleById
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

    put:
      summary: Update a role
      operationId: updateRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

    delete:
      summary: Permanently delete a role
      operationId: deleteRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role deleted successfully
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}/soft-delete:
    patch:
      summary: Soft delete a role
      operationId: softDeleteRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role soft deleted successfully
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}/status:
    patch:
      summary: Change role status (activate/deactivate)
      operationId: changeRoleStatus
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
              required:
                - isActive
      responses:
        '200':
          description: Role status updated successfully
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - name

    HttpError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request
      required:
        - code
        - message

security:
  - bearerAuth: []
