openapi: 3.0.0
info:
  title: Roles Service API
  version: 0.0.1
  description: |
    API for managing roles within stores, including CRUD operations, soft delete, permanent delete, filtering, and pagination.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{protocol}://{hostname}{port}{basePath}"
    description: Configurable server (local or deployed)
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      hostname:
        default: localhost
      port:
        default: ":8080"
      basePath:
        default: ""
        enum:
          - ""
          - "/role-es"
        description: Optional path for the deployed version

paths:
  /api/v1/es/roles:
    get:
      summary: Get a paginated list of roles
      description: >
        Retrieve a paginated list of roles with advanced filtering capabilities.
      operationId: getRoles
      tags:
        - Roles
      parameters:
        - name: storeId
          in: query
          description: Filter roles by store ID.
          required: false
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Filter roles by name (case-insensitive partial match).
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          description: Filter roles by active status.
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          description: Page number to retrieve (0-based).
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          description: Number of elements per page.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: >
            Sort criteria in the format: `property,(asc|desc)`.
            Default order is ascending. Multiple sort criteria supported.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated list of roles retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new role
      description: Create a new role within a store.
      operationId: createRole
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        '201':
          description: Role created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/deleted:
    get:
      summary: Get a paginated list of deleted roles
      description: >
        Retrieve a paginated list of roles that have been soft deleted.
      operationId: getDeletedRoles
      tags:
        - Roles
      parameters:
        - name: storeId
          in: query
          description: Filter roles by store ID.
          required: false
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Filter roles by name (case-insensitive partial match).
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number to retrieve (0-based).
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          description: Number of elements per page.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: >
            Sort criteria in the format: `property,(asc|desc)`.
            Default order is ascending. Multiple sort criteria supported.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated list of deleted roles retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/{id}:
    get:
      summary: Get a role by ID
      description: Retrieve a specific role by its unique identifier.
      operationId: getRoleById
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update a role
      description: Update an existing role's information.
      operationId: updateRole
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        '200':
          description: Role updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Permanently delete a role
      description: Permanently remove a role from the system.
      operationId: permanentDeleteRole
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role permanently deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/{id}/soft-delete:
    patch:
      summary: Soft delete a role
      description: Mark a role as deleted without permanently removing it.
      operationId: softDeleteRole
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role soft deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/{id}/status:
    patch:
      summary: Change role status
      description: Activate or deactivate a role.
      operationId: changeRoleStatus
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '204':
          description: Role status updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the role.
        storeId:
          type: string
          format: uuid
          description: ID of the store this role belongs to.
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Name of the role.
        description:
          type: string
          maxLength: 255
          description: Description of the role.
        isActive:
          type: boolean
          description: Whether the role is active.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the role was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the role was last updated.
        deletedAt:
          type: string
          format: date-time
          description: Timestamp when the role was deleted (null if not deleted).

    RoleRequest:
      type: object
      properties:
        storeId:
          type: string
          format: uuid
          description: ID of the store this role belongs to.
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Name of the role.
        description:
          type: string
          maxLength: 255
          description: Description of the role.
      required: [ storeId, name ]

    StatusRequest:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          description: The desired active status for the role.

    RolePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: List of roles in the current page.
        pageable:
          $ref: '#/components/schemas/Pageable'
        last:
          type: boolean
          description: Whether this is the last page.
        totalPages:
          type: integer
          format: int32
          description: Total number of pages.
        totalElements:
          type: integer
          format: int64
          description: Total number of elements across all pages.
        size:
          type: integer
          format: int32
          description: Size of the current page.
        number:
          type: integer
          format: int32
          description: Current page number (0-based).
        sort:
          $ref: '#/components/schemas/Sort'
        first:
          type: boolean
          description: Whether this is the first page.
        numberOfElements:
          type: integer
          format: int32
          description: Number of elements in the current page.
        empty:
          type: boolean
          description: Whether the page is empty.

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
          description: Current page number (0-based).
        pageSize:
          type: integer
          format: int32
          description: Size of the page.
        sort:
          $ref: '#/components/schemas/Sort'
        offset:
          type: integer
          format: int64
          description: Offset of the first element in the page.
        paged:
          type: boolean
          description: Whether the result is paged.
        unpaged:
          type: boolean
          description: Whether the result is unpaged.

    Sort:
      type: object
      properties:
        empty:
          type: boolean
          description: Whether the sort is empty.
        sorted:
          type: boolean
          description: Whether the result is sorted.
        unsorted:
          type: boolean
          description: Whether the result is unsorted.

    HttpError:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: Error message.
          example: Invalid request body.
      required:
        - code
        - message

  responses:
    BadRequest:
      description: Bad Request - Invalid input parameters or request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            validation_error:
              summary: Validation error
              value:
                code: 400
                message: "Field 'name' is mandatory"

    NotFound:
      description: Not Found - The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            role_not_found:
              summary: Role not found
              value:
                code: 404
                message: "Role not found"

    InternalServerError:
      description: Internal Server Error - An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            server_error:
              summary: Internal server error
              value:
                code: 500
                message: "Internal server error"

security:
  - bearerAuth: []
