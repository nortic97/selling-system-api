openapi: 3.0.0
info:
  title: Roles Service API
  version: 0.0.1
  description: |
    API for managing roles within stores, including CRUD operations, soft delete, permanent delete, filtering, and pagination.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{protocol}://{hostname}{port}{basePath}"
    description: Configurable server (local or deployed)
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      hostname:
        default: localhost
      port:
        default: ":8080"
      basePath:
        default: ""
        enum:
          - ""
          - "/role-es"
        description: Optional path for the deployed version

paths:
  /api/v1/es/roles:
    get:
      summary: Get all roles (without pagination)
      description: >
        Retrieve all roles without pagination. Use this endpoint when you need to fetch all roles at once.
      operationId: getAllRoles
      tags:
        - Roles
      responses:
        '200':
          description: List of all roles retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
    post:
      summary: Create a new role
      description: Create a new role with the provided details.
      operationId: createRole
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '201':
          description: Role created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/search:
    post:
      summary: Search roles with filters and pagination
      description: >
        Search roles with advanced filtering, sorting and pagination capabilities.
      operationId: searchRoles
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSearchRequest'
      responses:
        '200':
          description: Search results matching criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/deleted:
    get:
      summary: Get all deleted roles (without pagination)
      description: Retrieve a list of all soft-deleted roles without pagination.
      operationId: getAllDeletedRoles
      tags:
        - Roles
      responses:
        '200':
          description: List of deleted roles retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/deleted/search:
    post:
      summary: Search deleted roles with filters and pagination
      description: >
        Search deleted roles with advanced filtering, sorting and pagination capabilities.
      operationId: searchDeletedRoles
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSearchRequest'
      responses:
        '200':
          description: Search results matching criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/{id}:
    get:
      summary: Get a role by ID
      description: Retrieve a specific role by its unique identifier.
      operationId: getRoleById
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update a role
      description: Update an existing role's information.
      operationId: updateRole
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        '200':
          description: Role updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Permanently delete a role
      description: Permanently remove a role from the system.
      operationId: permanentDeleteRole
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role permanently deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/{id}/soft-delete:
    patch:
      summary: Soft delete a role
      description: Mark a role as deleted without permanently removing it.
      operationId: softDeleteRole
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role soft deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/{id}/status:
    patch:
      summary: Change role status
      description: Activate or deactivate a role.
      operationId: changeRoleStatus
      tags:
        - Roles
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the role.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '204':
          description: Role status updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the role.
        storeId:
          type: string
          format: uuid
          description: ID of the store this role belongs to.
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Name of the role.
        description:
          type: string
          maxLength: 255
          description: Description of the role.
        isActive:
          type: boolean
          description: Whether the role is active.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the role was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the role was last updated.
        deletedAt:
          type: string
          format: date-time
          description: Timestamp when the role was deleted (null if not deleted).

    RoleRequest:
      type: object
      properties:
        storeId:
          type: string
          format: uuid
          description: ID of the store this role belongs to.
          x-field-extra-annotation: '@NotNull'
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Name of the role.
          x-field-extra-annotation: '@NotBlank @Size(min = 3, max = 50)'
        description:
          type: string
          maxLength: 255
          description: Description of the role.
          x-field-extra-annotation: '@Size(max = 255)'
      required: [ storeId, name ]

    StatusRequest:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          description: The desired active status for the role.
          x-field-extra-annotation: '@NotNull'

    RoleSearchRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            storeId:
              type: string
              format: uuid
              description: Filter by store ID.
            name:
              type: string
              description: Filter by name (case-insensitive contains).
            isActive:
              type: boolean
              description: Filter by active status.
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
              default: 1
              description: Page number (1-based).
            size:
              type: integer
              minimum: 20
              maximum: 100
              default: 20
              description: Number of items per page (min 20, max 100).
        sort:
          type: array
          items:
            type: object
            properties:
              property:
                type: string
                enum: [name, createdAt, updatedAt]
                description: Field to sort by.
              direction:
                type: string
                enum: [ASC, DESC]
                default: ASC
                description: Sort direction.
          description: Sorting criteria.

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: List of items in the current page.
        page:
          type: integer
          description: Current page number.
        size:
          type: integer
          description: Number of items per page.
        totalItems:
          type: integer
          description: Total number of items across all pages.
        totalPages:
          type: integer
          description: Total number of pages.
      required:
        - data
        - page
        - size
        - totalItems
        - totalPages

    HttpError:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: Error message.
          example: Invalid request body.
      required:
        - code
        - message

  responses:
    BadRequest:
      description: Bad Request - Invalid input parameters or request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            validation_error:
              summary: Validation error
              value:
                code: 400
                message: "Field 'name' is mandatory"

    NotFound:
      description: Not Found - The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            role_not_found:
              summary: Role not found
              value:
                code: 404
                message: "Role not found"

    InternalServerError:
      description: Internal Server Error - An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            server_error:
              summary: Internal server error
              value:
                code: 500
                message: "Internal server error"

security:
  - bearerAuth: []
