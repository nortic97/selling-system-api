openapi: 3.0.0
info:
  title: Roles Service API
  version: 0.0.1
  description: |
    API for managing roles within stores, including CRUD operations, soft delete, permanent delete, filtering, and pagination.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{protocol}://{hostname}{port}{basePath}"
    description: Configurable server (local or deployed)
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      hostname:
        default: localhost
      port:
        default: ":8080"
      basePath:
        default: ""
        enum:
          - ""
          - "/role-es"
        description: Optional path for the deployed version

paths:
  /api/v1/es/role:
    post:
      summary: Create a new role
      operationId: createRole
      tags:
        - Role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Field Name is Mandatory"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}:
    get:
      summary: Get a role by ID
      operationId: getRoleById
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

    put:
      summary: Update a role
      operationId: updateRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Name is Mandatory"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

    delete:
      summary: Permanently delete a role
      operationId: deleteRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role deleted successfully
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}/soft-delete:
    patch:
      summary: Soft delete a role
      operationId: softDeleteRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role soft deleted successfully
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}/status:
    patch:
      summary: Change role status (activate/deactivate)
      operationId: changeRoleStatus
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
              required:
                - isActive
      responses:
        '200':
          description: Role status updated successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/list/{storeId}:
    get:
      summary: List roles of a store, optionally paginated
      operationId: listRolesOfStore
      tags:
        - Role
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePagination"
        '400':
          description: Invalid parameters (e.g., invalid UUID format, bad query params)
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Invalid UUID format for storeId"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Store not found or no roles found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Store not found or no roles found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/roles:
    get:
      summary: Obtener una lista paginada de roles
      description: >
        Permite obtener una lista paginada de roles, con la capacidad de filtrar por múltiples criterios.
      operationId: getRoles
      tags:
        - Roles
      parameters:
        - name: storeId
          in: query
          description: ID de la tienda para filtrar los roles.
          required: false
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Filtrar roles por nombre (búsqueda exacta, insensible a mayúsculas).
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          description: Filtrar roles por su estado activo o inactivo.
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          description: >
            Búsqueda de texto libre en campos relevantes como nombre y descripción.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Número de la página a obtener (basado en 0).
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Número de elementos por página.
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: >
            Criterios de ordenación en el formato: `propiedad,(asc|desc)`.
            El orden por defecto es ascendente. Se permite ordenación múltiple.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Lista paginada de roles obtenida exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/es/roles/deleted:
    get:
      summary: Obtener una lista paginada de roles eliminados
      description: >
        Permite obtener una lista paginada de roles que han sido eliminados lógicamente (soft delete).
      operationId: getDeletedRoles
      tags:
        - Roles
      parameters:
        - name: storeId
          in: query
          description: ID de la tienda para filtrar los roles.
          required: false
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Filtrar roles por nombre (búsqueda exacta, insensible a mayúsculas).
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: >
            Búsqueda de texto libre en campos relevantes como nombre y descripción.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Número de la página a obtener (basado en 0).
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Número de elementos por página.
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: >
            Criterios de ordenación en el formato: `propiedad,(asc|desc)`.
            El orden por defecto es ascendente. Se permite ordenación múltiple.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Lista paginada de roles eliminados obtenida exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Store:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taxId:
          type: string
        name:
          type: string
        logo:
          type: string
        description:
          type: string
        slogan:
          type: string
        address:
          type: string
        stateProvince:
          type: string
        city:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        storeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 50
        description:
          type: string
          maxLength: 255
        isActive:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    RolePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        pageable:
          $ref: '#/components/schemas/Pageable'
        last:
          type: boolean
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/Sort'
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/Sort'
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        unpaged:
          type: boolean

    Sort:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean

    RoleRequest:
      type: object
      required:
        - storeId
        - name
      properties:
        storeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 50
        description:
          type: string
          maxLength: 255

    RolePagination:
      type: object
      properties:
        totalItems:
          type: integer
          description: Total number of roles matching the query in that store
          example: 300
        totalPages:
          type: integer
          description: Total number of pages
          example: 30
        page:
          type: integer
          description: Current page number
          example: 2
        limit:
          type: integer
          description: Number of roles per page
          example: 10
        hasNextPage:
          type: boolean
          description: True if there is a next page
          example: true
        hasPreviousPage:
          type: boolean
          description: True if there is a previous page
          example: true
        rolesList:
          type: array
          items:
            $ref: "#/components/schemas/Role"
      required:
        - total
        - page
        - limit
        - hasNextPage
        - hasPreviousPage

    HttpError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request
      required:
        - code
        - message

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"

security:
  - bearerAuth: []
