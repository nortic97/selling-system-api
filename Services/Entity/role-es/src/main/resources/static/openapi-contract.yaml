openapi: 3.0.0
info:
  title: Roles Service API
  version: 0.0.1
  description: |
    API for managing roles within stores, including CRUD operations, soft delete, permanent delete, filtering, and pagination.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{protocol}://{hostname}{port}{basePath}"
    description: Configurable server (local or deployed)
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      hostname:
        default: localhost
      port:
        default: ":8080"
      basePath:
        default: ""
        enum:
          - ""
          - "/role-es"
        description: Optional path for the deployed version

paths:
  /api/v1/es/role:
    post:
      summary: Create a new role
      operationId: createRole
      tags:
        - Role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Field Name is Mandatory"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}:
    get:
      summary: Get a role by ID
      operationId: getRoleById
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

    put:
      summary: Update a role
      operationId: updateRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Name is Mandatory"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

    delete:
      summary: Permanently delete a role
      operationId: deleteRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role deleted successfully
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}/soft-delete:
    patch:
      summary: Soft delete a role
      operationId: softDeleteRole
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role soft deleted successfully
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/{id}/status:
    patch:
      summary: Change role status (activate/deactivate)
      operationId: changeRoleStatus
      tags:
        - Role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
              required:
                - isActive
      responses:
        '200':
          description: Role status updated successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Role not found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Role not Found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/role/list/{storeId}:
    get:
      summary: List roles of a store, optionally paginated
      operationId: listRolesOfStore
      tags:
        - Role
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePagination"
        '400':
          description: Invalid parameters (e.g., invalid UUID format, bad query params)
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 400
                    message: "Invalid UUID format for storeId"
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Store not found or no roles found
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 404
                    message: "Store not found or no roles found"
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                error:
                  summary: Example of error response
                  value:
                    code: 500
                    message: "Internal Server Error"
              schema:
                $ref: "#/components/schemas/HttpError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Store:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taxId:
          type: string
        name:
          type: string
        logo:
          type: string
        description:
          type: string
        slogan:
          type: string
        address:
          type: string
        stateProvince:
          type: string
        city:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        store:
          $ref: "#/components/schemas/Store"
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - store
        - name

    RolePagination:
      type: object
      properties:
        totalItems:
          type: integer
          description: Total number of roles matching the query in that store
          example: 300
        totalPages:
          type: integer
          description: Total number of pages
          example: 30
        page:
          type: integer
          description: Current page number
          example: 2
        limit:
          type: integer
          description: Number of roles per page
          example: 10
        hasNextPage:
          type: boolean
          description: True if there is a next page
          example: true
        hasPreviousPage:
          type: boolean
          description: True if there is a previous page
          example: true
        rolesList:
          type: array
          items:
            $ref: "#/components/schemas/Role"
      required:
        - total
        - page
        - limit
        - hasNextPage
        - hasPreviousPage


    HttpError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request
      required:
        - code
        - message

security:
  - bearerAuth: []
