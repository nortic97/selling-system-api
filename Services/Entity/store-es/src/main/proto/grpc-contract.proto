syntax = "proto3";

package store;

option java_multiple_files = true;
option java_package = "com.nortic.pos.es.store.grpc.gen";
option java_outer_classname = "StoreProto";

service StoreService {
  rpc CreateStore (Store) returns (Store);
  rpc GetStoreById (StoreRequest) returns (Store);
  rpc UpdateStore (Store) returns (Store);
  rpc DeleteStore (StoreRequest) returns (DeleteResponse);
  rpc SoftDeleteStore (StoreRequest) returns (DeleteResponse);
  rpc ChangeStoreStatus (ChangeStatusRequest) returns (StoreResponse);
}

message Store {
  optional string id = 1;
  string tax_id = 2;
  string name = 3;
  optional string logo = 4;
  string description = 5;
  optional string slogan = 6;
  string address = 7;
  string country = 8;
  string state_province = 9;
  string city = 10;
  string phone_number = 11;
  string email = 12;
  optional bool is_active = 13;
  optional string created_at = 14;
  optional string updated_at = 15;
  optional string deleted_at = 16;
}

message StoreRequest {
  string id = 1;
}

message StoreResponse {
  bool success = 1;;
}

message DeleteResponse {
  bool success = 1;
}

message ChangeStatusRequest {
  string id = 1;
  bool status = 2;
}
