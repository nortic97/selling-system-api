openapi: 3.0.0
info:
  title: Stores Service API
  version: 0.0.1
  description: |
    API for managing stores, including CRUD operations, soft delete, permanent delete, and search functionality.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{protocol}://{hostname}{port}{basePath}"
    description: Configurable server (local or deployed)
    variables:
      protocol:
        enum:
          - http
          - https
        default: "http"
      hostname:
        default: "localhost"
        description: Server hostname (e.g., localhost or deployed server)
      port:
        default: ":8080"
        description: Server port
      basePath:
        default: ""
        enum:
          - ""
          - "/store-es"
        description: Optional path for the deployed version

paths:
  /api/v1/es/store:
    post:
      summary: Create a new store
      operationId: createStore
      tags:
        - Store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Store"
      responses:
        '201':
          description: Store created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/store/{id}:
    get:
      summary: Get a store by ID
      operationId: getStoreById
      tags:
        - Store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID.
      responses:
        '200':
          description: Store retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

    put:
      summary: Update an existing store
      operationId: updateStore
      tags:
        - Store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Store"
      responses:
        '200':
          description: Store updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

    delete:
      summary: Permanently delete a store
      operationId: deleteStore
      tags:
        - Store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID.
      responses:
        '200':
          description: Store deleted successfully.
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/store/{id}/soft-delete:
    patch:
      summary: Soft delete a store
      operationId: softDeleteStore
      tags:
        - Store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID.
      responses:
        '200':
          description: Store marked as deleted successfully.
        '404':
          description: Store not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

  /api/v1/es/store/{id}/status:
    patch:
      summary: Change store status (activate/deactivate)
      operationId: changeStoreStatus
      tags:
        - Store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
                  example: true
                  x-field-extra-annotation: '@NotNull'
              required:
                - isActive
      responses:
        '200':
          description: Store status updated successfully.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '404':
          description: Store not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Store:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taxId:
          type: string
          description: Identification number of store.
          x-field-extra-annotation: '@NotBlank'
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Name of the store.
          x-field-extra-annotation: '@NotBlank @Size(min = 3, max = 50)'
        logo:
          type: string
          description: Route logo.
        description:
          type: string
          maxLength: 500
          description: Detailed description of the store.
        slogan:
          type: string
          maxLength: 100
          description: Store's marketing slogan or tagline.
        address:
          type: string
          description: Physical address of the store.
          x-field-extra-annotation: '@NotBlank'
        country:
          type: string
          description: Country where the store is located.
        stateProvince:
          type: string
          description: State or province where the store is located.
          x-field-extra-annotation: '@NotBlank'
        city:
          type: string
          description: City where the store is located.
          x-field-extra-annotation: '@NotBlank'
        phoneNumber:
          type: string
          description: Contact phone number of the store. Accepts international and local formats.
          example: "(+57) 300 1234567"
          x-field-extra-annotation: '@NotBlank'
        email:
          type: string
          format: email
          description: Contact email address of the store.
          x-field-extra-annotation: '@NotBlank @Email'
        isActive:
          type: boolean
          description: Indicates whether the store is currently active.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the store was created.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the store was last updated.
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          description: Timestamp when the store was soft deleted (null if not deleted).
          readOnly: true
      required:
        - taxId
        - name
        - email
        - phoneNumber
        - address
        - stateProvince
        - city

    HttpError:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: Error message.
          example: Invalid request body.
      required:
        - code
        - message

security:
  - bearerAuth: [ ]