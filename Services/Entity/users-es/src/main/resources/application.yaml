spring:
  web:
    resources:
      add-mappings: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:selling_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  application:
    name: users-es

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    operationsSorter: method
    path: /swagger
    url: openapi-contract.yaml
  show-actuator: true

server:
  port: 8089
  error:
    whitelabel:
      enabled: false
