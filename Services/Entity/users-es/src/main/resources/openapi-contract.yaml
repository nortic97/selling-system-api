openapi: 3.0.0
info:
  title: Users Service API
  version: 0.0.2
  description: |
    API for managing users within stores and branches, including CRUD operations, soft delete, permanent delete, and search functionality.
  contact:
    name: Developer
    email: nortic97@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths:
  /api/v1/es/users:
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error

  /api/v1/es/users/{id}:
    get:
      summary: Get an user by id
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID.
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Bad Request
        '404':
          description: User not found
        '500':
          description: Internal Server Error

    put:
      summary: Update an existing user
      operationId: updateUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Bad Request
        '404':
          description: User not found
        '500':
          description: Internal Server Error

    delete:
      summary: Permanently delete a user
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID.
      responses:
        '204':
          description: User deleted successfully.
        '404':
          description: User not found
        '500':
          description: Internal Server Error

  /api/v1/es/users/{id}/mark-as-deleted:
    patch:
      summary: Mark delete a user
      operationId: markAsDeleteUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID.
      responses:
        '204':
          description: User marked as deleted successfully.
        '404':
          description: User not found
        '500':
          description: Internal Server Error

  /api/v1/es/users/deleted/{storeId}/{branchId}/{page}/{size}:
    get:
      summary: Get paginated list of soft-deleted users
      operationId: getSoftDeletedUsers
      tags:
        - Users
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID to filter soft-deleted users.
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Branch ID to filter soft-deleted users.
        - name: page
          in: path
          required: true
          schema:
            type: integer
            example: 0
          description: Page number (starts from 0).
        - name: size
          in: path
          required: true
          schema:
            type: integer
            example: 10
          description: Number of records per page.
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Filter users by username.
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter users by email.
        - name: documentNumber
          in: query
          required: false
          schema:
            type: string
          description: Filter users by document number.
      responses:
        '200':
          description: Paginated list of soft-deleted users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error

  /api/v1/es/users/{storeId}/{branchId}/{page}/{size}:
    get:
      summary: Get paginated list of users for a branch or store
      operationId: getUsers
      tags:
        - Users
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID. If used alone, retrieves all users in the store.
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Branch ID. Retrieves only the users of a specific branch.
        - name: page
          in: path
          required: true
          schema:
            type: integer
            example: 0
          description: Page number (starts from 0).
        - name: size
          in: path
          required: true
          schema:
            type: integer
            example: 10
          description: Number of records per page.
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Filter users by username.
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter users by email.
        - name: documentNumber
          in: query
          required: false
          schema:
            type: string
          description: Filter users by document number.
      responses:
        '200':
          description: Paginated list of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a5e4d903-f4d2-4ee5-b3a9-71924cb8eaf8"
        storeId:
          type: string
          format: uuid
          example: "b7254411-2819-4975-89af-6de3e039883c"
        branchId:
          type: string
          format: uuid
          example: "95b8c8a7-9f2b-4234-b86f-6a491cc0903b"
        firstName:
          type: string
        lastName:
          type: string
        documentType:
          $ref: "#/components/schemas/DocumentType"
        username:
          type: string
          example: "johndoe"
        password:
          type: string
          example: "Password123*"
        email:
          type: string
          format: email
          example: "johndoe@example.com"
        phone:
          type: string
          example: "(+57) 3258965540"
        roleId:
          type: string
          format: uuid
          example: "005b66c8-2cc0-468e-b584-3ae9395adfe1"
        accountType:
          $ref: "#/components/schemas/AccountType"
        isActive:
          type: boolean
          example: true
        isPrincipalAdmin:
          type: boolean
          example: false
        address:
          type: string
          example: "AV 12 - 4 Cra 15"
        dateOfBirth:
          type: string
          format: date
        photo:
          type: string
          example: "https://pic.com"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - id
        - storeId
        - branchId
        - firstName
        - lastName
        - documentType
        - username
        - password
        - email
        - phone
        - roleId
        - accountType
        - isActive
        - isPrincipalAdmin
        - address
        - dateOfBirth

    PaginatedUsers:
      type: object
      properties:
        totalPages:
          type: integer
          example: 5
        totalElements:
          type: integer
          example: 50
        size:
          type: integer
          example: 10
        currentPage:
          type: integer
          example: 1
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"

    DocumentType:
      type: string
      enum:
        - CC
        - TI
        - PP
        - CE

    AccountType:
      type: string
      enum:
        - Internal
        - Store owner
        - Employee

    HttpError:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: Error message.
          example: Invalid request body.
      required:
        - code
        - message

security:
  - bearerAuth: [ ]