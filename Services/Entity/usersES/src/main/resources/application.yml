spring:
    application:
        name: usersES
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:store}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:1234}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update

springdoc:
    swagger-ui:
        path: '/swagger'
    show-actuator: true