syntax = "proto3";

package com.nortic.pos.ms.auth.grpc;

option java_multiple_files = false;
option java_package = "com.nortic.pos.ms.auth.grpc";
option java_outer_classname = "AuthProto";

import "google/protobuf/timestamp.proto";

message LoginRequest {
  string username = 1;
  string password = 2;
  string access_type = 3;
}

message TokenExchangeRequest {
  string token = 1;
  string role_id = 2;
}

message LoginResponse {
  string token = 1;
  string refresh_token = 2;
  string token_type = 3;
}

message FieldErrorDetail {
  string field = 1;
  string message = 2;
  string rejected_value = 3;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated FieldErrorDetail details = 4;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc TokenExchange(TokenExchangeRequest) returns (LoginResponse);
}
