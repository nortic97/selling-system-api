spring:
  application:
    name: ms-auth
    env: ${ENVIRONMENT:local}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  web:
    error:
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false
      include-path: never

  grpc:
    server:
      port: ${GRPC_PORT:9090}
      health:
        enabled: true
      reflection:
        enabled: true
    client:
      channel:
        es-user:
          target: static://${USER_GRPC_HOST:localhost:9091}
        es-employee:
          target: static://${EMPLOYEE_GRPC_HOST:localhost:9096}

  jackson:
    time-zone: ${TIME_ZONE:America/Bogota}

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful

security:
  jwt:
    secret: ${JWT_SECRET:TjByNzFjUDBzXzIwMjZfQmFja2VuZF9Vc2VyX1NlcnZpY2VfSnd0X1NlY3JldF9WM19BOXhMMm1RN3BSOHRXNG5L}
  owner:
    permissions: ${OWNER_PERMISSIONS}
  employee:
    permissions: ${EMPLOYEE_PERMISSIONS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    metadata-map:
      metrics-path: ${EUREKA_METRICS_PATH:/actuator/prometheus}

management:
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
          - info

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger
  show-actuator: true