name: selling-system

networks:
  nortic-network:
    name: nortic-network
    driver: bridge

services:

  es-user:
    build:
      context: ./Services/Entity/es-user
      dockerfile: Dockerfile
    container_name: es-user
    ports:
      - "8081:8080"
      - "9091:9090"
    environment:
      DB_HOST: PC-David.lan
      EUREKA_URL: http://us-eureka:8761/eureka
      ENVIRONMENT: DEV
    networks:
      - nortic-network
    restart: unless-stopped

  es-store:
