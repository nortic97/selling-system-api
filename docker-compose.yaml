name: selling-system

networks:
  nortic-network:
    name: nortic-network
    driver: bridge

services:

  es-user:
    build:
      context: ./Services/Entity/es-user
      dockerfile: Dockerfile
    container_name: es-user
    ports:
      - "8081:8080"
      - "9091:9090"
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SQL_INIT_MODE: ${SQL_INIT_MODE}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      TIME_ZONE: ${TIME_ZONE}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_METRICS_PATH: ${EUREKA_METRICS_PATH}
    networks:
      - nortic-network
    restart: unless-stopped

  es-store:
